version: '3.8'

services:
  # production FastAPI ML API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unbiasly-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Mount the zero-shot model directory from the host into the container 
      # (caching model weights to avoid redownloading!)
      - ./backend/app/models/zero_shot:/app/app/models/zero_shot
      # Inject environmental credentials safely
      - ./backend/.env:/app/.env
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  # Nginx Reverse Proxy & Static Frontend Server
  frontend:
    image: nginx:alpine
    container_name: unbiasly-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Serve static files directly
      - ./frontend:/usr/share/nginx/html:ro
      # Inject custom reverse proxy rules
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
